[project]
name = "screensort-backend"
version = "0.1.0"
description = "Local ML-powered screenshot organizer backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "torch>=2.4.0",
  "transformers>=4.44.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
